# Conexión a la Base de Datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datagrada}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configuración de JWT
jwt.secret=${JWT_SECRET:UnaClaveSuperSecretaYMuyLargaDeMinimo32CaracteresParaQueSeaSegura}

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- OPTIMIZACIÓN DE MEMORIA Y CONEXIONES (AIVEN) ---
# Límite máximo de conexiones simultáneas (evita picos de RAM en Aiven)
spring.datasource.hikari.maximum-pool-size=3

# Permite que las conexiones inactivas bajen a 0 cuando nadie usa la web
spring.datasource.hikari.minimum-idle=0

# Tiempo que una conexión puede estar inactiva antes de cerrarse (5 minutos)
spring.datasource.hikari.idle-timeout=300000

# Tiempo máximo de vida de una conexión en la piscina (10 minutos)
spring.datasource.hikari.max-lifetime=600000